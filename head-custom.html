<!-- Mermaid.js -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
  document.addEventListener("DOMContentLoaded", async () => {
    document.querySelectorAll('.language-mermaid, pre code.language-mermaid, pre.mermaid').forEach(el => {
      const parent = el.closest('.highlighter-rouge') || el.closest('pre') || el;
      const code = el.innerText || el.textContent;
      const container = document.createElement('div');
      container.className = 'mermaid';
      container.textContent = code.trim();
      parent.replaceWith(container);
    });
    await mermaid.run();
  });
</script>
